<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Read Aloud</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="panel__head">
        <h1>Read Aloud</h1>
        <span id="status" class="status">Ready</span>
      </header>

      <p id="page-title" class="page-title"></p>

      <div class="progress" role="progressbar" aria-label="Reading progress" aria-valuemin="0" aria-valuemax="100">
        <div id="progress-bar" class="progress__bar"></div>
      </div>
      <p id="chunk-label" class="chunk-label">No audio loaded</p>

      <div class="transport">
        <button id="toggle" class="btn btn--primary" type="button">
          <span id="toggle-label">Read page</span>
        </button>
        <button id="stop" class="btn" type="button" disabled>Stop</button>
      </div>

      <fieldset class="field">
        <legend>Read</legend>
        <div class="segmented" role="radiogroup" aria-label="What to read">
          <button class="segmented__item is-active" type="button" data-scope="page" role="radio" aria-checked="true">
            Whole page
          </button>
          <button class="segmented__item" type="button" data-scope="selection" role="radio" aria-checked="false">
            Selection
          </button>
        </div>
      </fieldset>

      <fieldset class="field">
        <legend>
          Speed <output id="rate-value" for="rate">1.0&times;</output>
        </legend>
        <input id="rate" type="range" min="0.5" max="3" step="0.1" value="1" />
        <div class="presets">
          <button class="chip" type="button" data-rate="0.8">0.8&times;</button>
          <button class="chip" type="button" data-rate="1">1&times;</button>
          <button class="chip" type="button" data-rate="1.25">1.25&times;</button>
          <button class="chip" type="button" data-rate="1.5">1.5&times;</button>
          <button class="chip" type="button" data-rate="2">2&times;</button>
        </div>
      </fieldset>

      <fieldset class="field">
        <legend><label for="voice">Voice</label></legend>
        <select id="voice"></select>
      </fieldset>

      <p id="message" class="message" hidden></p>

      <footer class="panel__foot">
        <button id="open-options" class="link" type="button">Settings</button>
        <span class="hint">Alt+Shift+R play / pause &middot; Alt+Shift+S stop</span>
      </footer>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
