<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Read Aloud</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="panel__head">
        <h1>Read Aloud</h1>
        <!--
          Everything below is the state the popup shows before it has asked
          anyone anything, so the panel is complete on the first paint and the
          script only has to correct it. Nothing here claims to know what the
          reader is doing.
        -->
        <span id="status" class="status">Checking…</span>
      </header>

      <p id="page-title" class="page-title"></p>

      <div class="progress" role="progressbar" aria-label="Reading progress" aria-valuemin="0" aria-valuemax="100">
        <div id="progress-bar" class="progress__bar"></div>
      </div>
      <div class="meta">
        <p id="chunk-label" class="chunk-label">No audio loaded</p>
        <!--
          Hidden until a read is under way, because with nothing being read
          there is no answer to give and a dash in its place is just noise.
        -->
        <p id="time-left" class="chunk-label time-left" hidden></p>
      </div>

      <!--
        Hidden until the reader says this page was left part-read. Showing it
        by default would promise a position that most pages do not have.
      -->
      <div id="resume" class="resume" hidden>
        <span id="resume-label" class="resume__label"></span>
        <button id="start-over" class="link" type="button">Start over</button>
      </div>

      <div class="transport">
        <button
          id="previous"
          class="btn btn--icon"
          type="button"
          disabled
          aria-label="Back a sentence"
          title="Back a sentence (Alt+Shift+Left)"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M3 3h1.7v10H3z" />
            <path d="M13.2 3.3v9.4L6.4 8z" />
          </svg>
        </button>
        <button id="toggle" class="btn btn--primary" type="button">
          <span id="toggle-label">Read page</span>
        </button>
        <button
          id="next"
          class="btn btn--icon"
          type="button"
          disabled
          aria-label="Forward a sentence"
          title="Forward a sentence (Alt+Shift+Right)"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M11.3 3H13v10h-1.7z" />
            <path d="M2.8 3.3v9.4L9.6 8z" />
          </svg>
        </button>
        <button id="stop" class="btn" type="button" disabled>Stop</button>
      </div>

      <fieldset class="field">
        <legend>Read</legend>
        <div class="segmented" role="radiogroup" aria-label="What to read">
          <button class="segmented__item is-active" type="button" data-scope="page" role="radio" aria-checked="true">
            Whole page
          </button>
          <button class="segmented__item" type="button" data-scope="selection" role="radio" aria-checked="false">
            Selection
          </button>
        </div>
      </fieldset>

      <fieldset class="field">
        <legend>
          Speed <output id="rate-value" for="rate">1.0&times;</output>
        </legend>
        <input id="rate" type="range" min="0.5" max="3" step="0.1" value="1" />
        <div class="presets">
          <button class="chip" type="button" data-rate="0.8">0.8&times;</button>
          <button class="chip" type="button" data-rate="1">1&times;</button>
          <button class="chip" type="button" data-rate="1.25">1.25&times;</button>
          <button class="chip" type="button" data-rate="1.5">1.5&times;</button>
          <button class="chip" type="button" data-rate="2">2&times;</button>
        </div>
      </fieldset>

      <fieldset class="field">
        <legend><label for="voice">Voice</label></legend>
        <select id="voice">
          <option value="">Loading voices…</option>
        </select>
      </fieldset>

      <!--
        Hidden until the popup knows which credentials exist, because guessing
        either way would flash the wrong thing: the button when already signed
        in, or nothing when there is no way to read at all.
      -->
      <div id="auth" class="auth" hidden>
        <span id="auth-label" class="auth__label"></span>
        <button id="sign-in" class="link" type="button" hidden>Sign in with xAI</button>
      </div>

      <p id="message" class="message" hidden></p>

      <footer class="panel__foot">
        <button id="open-options" class="link" type="button">Settings</button>
        <span class="hint">Alt+Shift+ R play &middot; S stop &middot; &larr;&rarr; sentence</span>
      </footer>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
